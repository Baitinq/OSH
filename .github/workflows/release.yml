name: Release

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          previous=$(git tag --sort=-creatordate | head -n 1)
          if [ -n "$previous" ] && [ "$(git rev-list -n 1 "$previous")" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "previous=$previous" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        working-directory: src
        run: go test ./...

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="fn-${os}-${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -C src -trimpath -o "../dist/$name/fn" ./cmd/fn
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.changes.outputs.previous }}
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            i=1
            while git rev-parse "${tag}.${i}" >/dev/null 2>&1; do
              i=$((i + 1))
            done
            tag="${tag}.${i}"
          fi
          notes=(--generate-notes)
          if [ -n "$PREVIOUS" ]; then
            notes+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            "${notes[@]}"
